<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        button {
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Виберіть завдання для запуску:</h1>
    <button onclick="task3_1()">Завдання 3.1: Середнє арифметичне</button>
    <button onclick="task3_2()">Завдання 3.2: Трикутник з зірочок</button>
    <button onclick="task3_3()">Завдання 3.3: Максимальне число</button>
    <button onclick="task3_4()">Завдання 3.4: Сума та непарні (A..B)</button>
    <button onclick="task3_5()">Завдання 3.5: Числа Фібоначчі</button>
    <button onclick="task3_6()">Завдання 3.6: Таблиця множення</button>
    <script>
        // --- Завдання 3.1: Середнє арифметичне ---
function task3_1() {
    console.log("--- Запуск Завдання 3.1 ---");
    
    // Отримуємо числа та перетворюємо їх з рядка в число (Number)
    let n1 = Number(prompt("Завдання 3.1. Введіть перше число:"));
    let n2 = Number(prompt("Завдання 3.1. Введіть друге число:"));
    let n3 = Number(prompt("Завдання 3.1. Введіть третє число:"));

    // Перевірка на валідність введення (чи це числа)
    if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
        alert("Будь ласка, вводьте коректні числа.");
        return;
    }

    // Перевірка умови: якщо серед чисел є рівні
    if (n1 === n2 || n2 === n3 || n1 === n3) {
        alert("Помилка: серед чисел є рівні значення.");
    } else {
        let average = (n1 + n2 + n3) / 3;
        alert("Середнє арифметичне: " + average);
    }
}

// --- Завдання 3.2: Прямокутний трикутник ---
function task3_2() {
    console.log("--- Запуск Завдання 3.2 ---");
    
    let height = parseInt(prompt("Завдання 3.2. Введіть висоту трикутника (від 3 до 12):"));

    // Валідація діапазону
    if (isNaN(height) || height < 3 || height > 12) {
        alert("Некоректна висота! Введіть число від 3 до 12.");
        return;
    }

    let triangle = "";
    // Цикл для побудови рядків
    for (let i = 1; i <= height; i++) {
        // Додаємо зірочки. Кількість зірочок дорівнює номеру рядка (i)
        // \n означає перенесення на новий рядок
        triangle += "*".repeat(i) + "\n";
    }

    alert(triangle);
}

// --- Завдання 3.3: Максимальне число ---
function task3_3() {
    console.log("--- Запуск Завдання 3.3 ---");
    
    let n1 = Number(prompt("Завдання 3.3. Введіть число 1:"));
    let n2 = Number(prompt("Завдання 3.3. Введіть число 2:"));
    let n3 = Number(prompt("Завдання 3.3. Введіть число 3:"));

    if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
        alert("Введено некоректні дані.");
        return;
    }

    // Використовуємо Math.max для пошуку максимального
    let maxNum = Math.max(n1, n2, n3);
    
    alert("Максимальне число: " + maxNum);
}

// --- Завдання 3.4: Сума та непарні числа в діапазоні ---
function task3_4() {
    console.log("--- Запуск Завдання 3.4 ---");
    
    let A = parseInt(prompt("Завдання 3.4. Введіть число A (початок):"));
    let B = parseInt(prompt("Завдання 3.4. Введіть число B (кінець, має бути > A):"));

    // Перевірки
    if (isNaN(A) || isNaN(B)) {
        alert("Введіть коректні цілі числа.");
        return;
    }
    if (A >= B) {
        alert("Помилка: Число A має бути меншим за B!");
        return;
    }

    let sum = 0;
    let oddNumbers = []; // Масив для збереження непарних чисел

    // Проходимо циклом від A до B (включно)
    for (let i = A; i <= B; i++) {
        // Натуральні числа - це цілі числа > 0.
        // Якщо за умовою "натуральні", то ігноруємо від'ємні та нуль
        if (i > 0) {
            sum += i;
        }

        // Перевірка на непарність (остача від ділення на 2 не дорівнює 0)
        if (i % 2 !== 0) {
            oddNumbers.push(i);
        }
    }

    let message = `Діапазон [${A}, ${B}]:\n` +
                  `Сума натуральних чисел: ${sum}\n` +
                  `Непарні числа: ${oddNumbers.join(", ")}`;
    
    alert(message);
    console.log(message);
}

// --- Завдання 3.5: Числа Фібоначчі ---
function task3_5() {
    console.log("--- Запуск Завдання 3.5 ---");
    
    let n = parseInt(prompt("Завдання 3.5. Скільки чисел Фібоначчі вивести (n)?"));

    if (isNaN(n) || n <= 0) {
        alert("Введіть додатне ціле число.");
        return;
    }

    // Базові перші два числа
    let fib = [0, 1];

    if (n === 1) {
        alert("Ряд Фібоначчі: 0");
        return;
    }

    // Генеруємо ряд до n елементів
    for (let i = 2; i < n; i++) {
        // Наступне число = сума двох попередніх
        fib[i] = fib[i - 1] + fib[i - 2];
    }

    // Якщо користувач хотів менше 2 елементів, обрізаємо, інакше виводимо весь масив
    let result = fib.slice(0, n).join(", ");
    
    alert(`Ряд Фібоначчі (${n} елементів): \n${result}`);
    console.log("Фібоначчі:", result);
}

// --- Завдання 3.6: Таблиця множення (0-9) ---
function task3_6() {
    console.log("--- Запуск Завдання 3.6 ---");
    
    // Для виводу таблиці найкраще використовувати console.log або document.write,
    // оскільки alert не збереже форматування великої таблиці добре.
    // Я виведу в консоль та сформую рядок для alert.

    let outputText = "Таблиця множення (перегляньте консоль для кращого вигляду):\n";
    
    // Зовнішній цикл (перший множник)
    for (let i = 0; i <= 9; i++) {
        let row = "";
        // Внутрішній цикл (другий множник)
        for (let j = 0; j <= 9; j++) {
            // Форматування: 2 * 3 = 6
            // Додаємо відступи для вирівнювання (опціонально)
            let res = i * j;
            row += `${i}x${j}=${res}\t`; // \t - це табуляція
        }
        console.log(row); // Вивід рядка в консоль
        outputText += row + "\n";
    }

    // Оскільки таблиця велика, alert може бути нечитабельним,
    // але за умовами завдання виводимо на екран.
    alert("Таблиця виведена в консоль (F12). Ось перші рядки:\n" + outputText.substring(0, 500) + "...");
}
    </script>
</body>
</html>
