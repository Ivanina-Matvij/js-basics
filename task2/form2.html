<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <style>
        body {
            background-color: #d3d3d3; /* Сірий фон сторінки */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: white;
            padding: 40px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Щоб padding не збільшував ширину */
            font-size: 14px;
        }
        button {
            background-color: #3b71ca; /* Синій колір кнопки */
            color: white;
            border: none;
            padding: 15px;
            width: 40%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c5aa0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Sign up</h1>
        
        <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Michael Hart">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="mhartl@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="•••••">
        </div>

        <div class="form-group">
            <label>Confirmation</label>
            <input type="password" placeholder="•••••">
        </div>

        <button type="submit">Create my account</button>
    </div>

</body>
</html>
