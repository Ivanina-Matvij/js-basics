<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Contact Form Dark</title>
    <style>
        body {
            background-color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .form-container {
            width: 500px;
            background-color: #1a1a1a; /* Темний фон форми */
            border: 1px solid #000;
        }
        .form-header {
            background-color: #2b2b2b;
            padding: 15px 20px;
            color: #e0e0aa; /* Жовтуватий колір тексту */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #444;
        }
        .form-body {
            padding: 30px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: center;
        }
        .form-row label {
            color: #ccc;
            width: 30%;
            text-align: right;
            margin-right: 20px;
        }
        .form-row input, 
        .form-row textarea {
            width: 65%;
            background-color: #222;
            border: 1px solid #333;
            padding: 10px;
            color: white;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .form-row textarea {
            height: 100px;
            resize: none;
        }
        .button-row {
            text-align: right;
            margin-top: 20px;
        }
        button {
            background-color: #b22222; /* Темно-червоний */
            color: white;
            border: 1px solid #d00;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #a00000;
        }
        span.required {
            color: #ccc;
            font-size: 12px;
            vertical-align: super;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">Contact Form</div>
        
        <div class="form-body">
            <div class="form-row">
                <label>Full name <span class="required">*</span></label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Email <span class="required">*</span></label>
                <input type="email">
            </div>

            <div class="form-row">
                <label>Subject <span class="required">*</span></label>
                <input type="text">
            </div>

            <div class="form-row" style="align-items: flex-start;">
                <label style="margin-top: 10px;">Message <span class="required">*</span></label>
                <textarea></textarea>
            </div>

            <div class="button-row">
                <button type="submit">Submit Form</button>
            </div>
        </div>
    </div>

</body>
</html>
